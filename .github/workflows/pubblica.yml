name: Pubblica

# main va in produzione (contabilita/), prova nell'ambiente di prova (contabilita-test/, database a parte).
# Nessun altro branch pubblica: né integrazione né ticket/*. Nessun avvio a mano.
# Credenziali e configurazione stanno nei segreti degli ambienti GitHub "produzione" e "prova"
# (Settings > Environments), mai nel repo. Elenco e prima installazione: docs/pubblicazione.md.
on:
  push:
    branches: [main, prova]

# Una pubblicazione alla volta per ambiente, senza interromperne una già iniziata a metà.
concurrency:
  group: pubblica-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  pubblica:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'produzione' || 'prova' }}
    steps:
      - uses: actions/checkout@v4

      # Solo dipendenze di produzione, senza config:cache: salverebbe i percorsi assoluti del runner.
      - name: Dipendenze e stili
        run: docker compose run --rm tools sh -c "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist && npm ci && npm run build"

      # Il .env nasce qui dai segreti dell'ambiente e viaggia solo nel canale FTPS.
      - name: Configurazione dell'ambiente
        env:
          APP_URL: ${{ vars.SITO_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_WORKSPACE_DOMAIN: ${{ vars.GOOGLE_WORKSPACE_DOMAIN }}
          AMMINISTRATORI_INIZIALI: ${{ secrets.AMMINISTRATORI_INIZIALI }}
          EMERGENZA_PASSWORD_HASH: ${{ secrets.EMERGENZA_PASSWORD_HASH }}
          EMERGENZA_TOTP_SECRET: ${{ secrets.EMERGENZA_TOTP_SECRET }}
          MIGRAZIONI_TOKEN: ${{ secrets.MIGRAZIONI_TOKEN }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          MAIL_MAILER: ${{ vars.MAIL_MAILER }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          DB_PROVA_DATABASE: ${{ vars.DB_PROVA_DATABASE }}
          DRIVE_CREDENZIALI:${{ secrets.DRIVE_CREDENZIALI }}
          DRIVE_CARTELLA_BACKUP: ${{ vars.DRIVE_CARTELLA_BACKUP }}
        run: sh scripts/scrivi-env.sh > .env

      # Storage: sul runner contiene solo i segnaposto del repo, e l'azione cancella dal server soltanto
      # ciò che aveva caricato lei (file di stato): log, sessioni e backup del server non si toccano.
      # Azione fissata al commit della v4.4.0 (SamKirkland/FTP-Deploy-Action): è l'unico modo di caricare
      # via FTPS cancellando solo i file già pubblicati da lei; la sua alternativa sarebbe uno script lftp scritto qui.
      - name: Carica via FTPS
        id: caricamento
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ vars.FTP_CARTELLA }}
          state-name: storage/.ftp-deploy-sync-state.json
          exclude: |
            .git/**
            .github/**
            node_modules/**
            tests/**
            docker/**
            docs/**
            orchestrazione/**
            scripts/**
            docker-compose.yml
            **/*.log

      # Solo la prima volta fa qualcosa (database vuoto): senza tabelle l'app risponde 500 e il controllo sotto
      # fallirebbe. Poi risponde 409 e le migrazioni le avvia l'Amministratore dalla pagina Migrazioni.
      # Se le migrazioni falliscono risponde 424 e il passo diventa rosso. Nessun --retry: la chiamata non si ripete
      # mai, perché dopo un errore non catturabile (tempo massimo di PHP) la seconda riceverebbe 409 con lo schema a metà.
      - name: Prima installazione del database
        env:
          SITO_URL: ${{ vars.SITO_URL }}
          MIGRAZIONI_TOKEN: ${{ secrets.MIGRAZIONI_TOKEN }}
        run: |
          codice=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $MIGRAZIONI_TOKEN" "$SITO_URL/manutenzione/migrazioni/prima-installazione")
          echo "prima-installazione -> $codice"
          test "$codice" = 200 -o "$codice" = 409

      # Anche se un passo dopo il caricamento è fallito: i file sono comunque sul server.
      - name: Raggiungibilità vietata di configurazione, storage e log
        if: ${{ !cancelled() && steps.caricamento.outcome == 'success' }}
        env:
          SITO_URL: ${{ vars.SITO_URL }}
        run: sh scripts/controlla-pubblicazione.sh "$SITO_URL"
