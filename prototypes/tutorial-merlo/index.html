<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket #22 "Tutorial animato con il personaggio".
  Domanda: come appare e si muove la prima missione del tesoriere ("Import e revisione") guidata da Merlo?
  Tre varianti della stessa missione, scelte con ?variant=A|B|C o con la barra in basso (frecce ← →):
    A · Volo      — la pagina si scurisce intorno all'elemento, Merlo vola da un elemento all'altro col fumetto accanto.
    B · Taccuino  — Merlo sta in un pannello a destra con l'elenco dei passi; la pagina resta in chiaro, l'elemento ha un anello.
    C · Dialogo   — riquadro in basso da videogioco, testo che si scrive da solo, freccia che saltella sopra l'elemento.
  La barra del prototipo cambia anche: prima volta / rifatta (versione rapida), movimento ridotto, ricomincia.
  Sul telefono (sotto i 760 px) tutte le varianti diventano un foglio in basso, dopo l'avviso "va meglio dal computer".

  Peso: solo CSS e SVG in linea, nessuna libreria, nessun Lottie o Rive, nessun Node.js. Il file intero (con le
  schermate finte) pesa pochi KB; Merlo e le animazioni sono una frazione. Si genera tale e quale da una vista Blade.
  Dati inventati (soci, fornitori, importi), nessun dato reale. Stato solo in memoria: ricaricare riparte da capo.
  Non va in produzione.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Tutorial Merlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- token: gli stessi della schermata di revisione (#20) ---------- */
:root {
  --yellow: #ffd900;            /* CMYK 0/15/100/0. Mai rosso. */
  --black: #0f0f0e;
  --ground: #f6f6f4; --surface: #ffffff; --raised: #f2f2f0; --active: #ebebe8;
  --border: #e6e6e2; --rule: #f0f0ed; --control: #cfcfca;
  --text: #0f0f0e; --muted: #5c5c58; --faint: #6b6b66;
  --positive: #247b50;
  --pill-pos-bg: #dcfae5; --pill-pos-ink: #04250e;
  --pill-info-bg: #e3ecfb; --pill-info-ink: #0b3a80;
  --pill-warn-bg: #fff3c2; --pill-warn-ink: #5c4300;
  --doubt-bg: #fffbe6; --doubt-bar: #e6c200;
  --pill-neutral-bg: #ececea; --pill-neutral-ink: #3a3a37;
  --font: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --radius-card: 8px; --radius-control: 6px; --control-height: 34px; --pad: 24px; --gap: 16px; --card-pad: 20px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --fly: 650ms;                 /* durata del volo di Merlo; la versione rapida la accorcia */
  --frame: 6px;                 /* cornice a strisce dello spazio di prova */
  --trialbar: 40px;
}
body.rapida { --fly: 300ms; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--text); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 4px; }
.num, .money { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.money { font-weight: 600; white-space: nowrap; }
.muted { color: var(--muted); } .small { font-size: 12px; line-height: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: var(--control-height); padding: 0 14px; border-radius: var(--radius-control); border: 1px solid var(--control); background: var(--surface); font-weight: 500; white-space: nowrap; cursor: pointer; }
.btn:hover { background: var(--raised); }
.btn.primary { background: var(--yellow); border-color: var(--text); }
.btn.primary:hover { background: #f2cd00; }
.btn.dark { background: var(--black); color: var(--yellow); border-color: var(--black); }
.btn.sm { height: 30px; padding: 0 10px; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); }
.pill.pos { background: var(--pill-pos-bg); color: var(--pill-pos-ink); }
.pill.info { background: var(--pill-info-bg); color: var(--pill-info-ink); }
.pill.warn { background: var(--pill-warn-bg); color: var(--pill-warn-ink); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100svh; transition: padding 300ms var(--ease-out); }
.sidebar { position: sticky; top: 0; height: 100svh; display: flex; flex-direction: column; gap: 2px; padding: 14px 12px; border-right: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 6px; margin-bottom: 10px; font-weight: 600; }
.scope { margin: 0 4px 14px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; color: var(--muted); text-align: left; cursor: pointer; }
.nav-item:hover { background: var(--raised); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--active); color: var(--text); }
.nav-item svg { width: 16px; height: 16px; flex: none; }
.nav-item .count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--text); color: var(--yellow); font: 500 12px/20px var(--mono); text-align: center; }
.topnav { display: none; }
.canvas { min-width: 0; padding: var(--pad); }
.title { margin-bottom: 20px; }
.title h1 { font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.01em; }
.title p { margin-top: 4px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); margin-bottom: var(--gap); }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px var(--card-pad); }
.panel-head h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
.spacer { flex: 1; }

/* import */
.imp { display: grid; gap: 16px; padding: 4px var(--card-pad) var(--card-pad); max-width: 640px; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 500; }
.field select { height: 38px; padding: 0 10px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); }
.drop { display: grid; justify-items: start; gap: 10px; padding: 20px; border: 1px dashed var(--control); border-radius: var(--radius-control); }
.file { display: flex; align-items: center; gap: 10px; font: 13px/18px var(--mono); }
.file svg { width: 20px; height: 20px; }

/* revisione */
.ledger { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 28px; padding: 14px var(--card-pad); }
.ledger .k { font-size: 12px; color: var(--muted); }
.ledger .v { font: 400 18px/24px var(--mono); }
.ledger .tot .v { font-weight: 600; }
.ledger .op { color: var(--faint); margin-right: 6px; }
.progress { padding: 14px var(--card-pad); border-top: 1px solid var(--border); }
.progress .k { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.track { position: relative; height: 10px; margin-top: 8px; border-radius: 5px; background: var(--raised); border: 1px solid var(--border); overflow: hidden; }
.track span { position: absolute; inset: 0 auto 0 0; background: var(--yellow); border-right: 1px solid rgba(0,0,0,.25); transition: width 300ms var(--ease-out); }
.sec { padding: 10px var(--card-pad); background: var(--raised); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.sec .t { font-weight: 600; }
.row { display: grid; grid-template-columns: 56px minmax(0, 1fr) 200px 100px 120px 76px; align-items: center; gap: 12px; min-height: 56px; padding: 6px var(--card-pad); border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .who { font-weight: 500; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.row .desc { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; line-height: 16px; color: var(--muted); }
.row select { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); }
.row select.unset { border-style: dashed; color: var(--muted); }
.row .money { text-align: right; }
.row .st { text-align: right; }
.row.ok .who, .row.ok .money { color: var(--muted); }
.row.dubbio { background: var(--doubt-bg); box-shadow: inset 3px 0 0 var(--doubt-bar); }
.rbs { display: inline-flex; gap: 6px; justify-content: flex-end; }
.rb { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--control); border-radius: var(--radius-control); background: var(--surface); cursor: pointer; }
.rb svg { width: 16px; height: 16px; }
.rb.ok:hover { background: var(--yellow); border-color: var(--text); }
.rb[aria-disabled="true"] { background: var(--raised); color: var(--faint); border-color: var(--border); cursor: help; }
.rb.q[aria-pressed="true"] { background: var(--pill-warn-bg); border-color: var(--doubt-bar); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.spin { width: 16px; height: 16px; border: 2px solid var(--control); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* impara */
.missions { list-style: none; margin: 0; padding: 0; }
.mission { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px var(--card-pad); border-top: 1px solid var(--rule); }
.mission .n { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--control); font: 500 13px/1 var(--mono); }
.mission.done .n { background: var(--black); color: var(--yellow); border-color: var(--black); }
.mission.next { background: var(--doubt-bg); }
.mission .t { font-weight: 500; }
.mission.later { color: var(--faint); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: var(--gap); padding: 10px 14px; border: 1px solid #f0d76a; border-radius: var(--radius-control); background: var(--doubt-bg); color: #4d3a00; }
.parchment { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px var(--card-pad) 20px; background: #fffbe5; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius-card) var(--radius-card); }
.slot { width: 64px; height: 64px; border-radius: 50%; border: 1.5px dashed var(--control); }

/* ---------- spazio di prova: cornice a strisce e barra fissa ---------- */
.frame { position: fixed; inset: 0; z-index: 70; pointer-events: none; border: var(--frame) solid transparent; border-image: repeating-linear-gradient(45deg, var(--yellow) 0 10px, var(--black) 10px 20px) var(--frame); opacity: 0; transition: opacity 300ms ease; }
.trialbar { position: fixed; z-index: 69; top: 0; left: 0; right: 0; height: calc(var(--trialbar) + var(--frame)); padding: var(--frame) calc(var(--frame) + 10px) 0; display: flex; align-items: center; gap: 12px; background: var(--black); color: #fff; transform: translateY(-100%); transition: transform 300ms var(--ease-out); }
.trialbar b { color: var(--yellow); font-weight: 500; }
.trialbar .btn { height: 28px; background: transparent; color: #fff; border-color: #555; }
.trialbar .btn:hover { background: #2a2a28; }
.trialbar .mp { display: flex; align-items: center; gap: 10px; margin-left: auto; margin-right: 6px; min-width: 0; }
.trialbar .mp .track { width: 160px; margin: 0; background: #2a2a28; border-color: #444; }
.trialbar .mp .num { color: #ccc; font-size: 12px; }
body.trial .frame { opacity: 1; }
body.trial .trialbar { transform: none; }
body.trial .app { padding: calc(var(--trialbar) + var(--frame)) var(--frame) var(--frame); }
body.trial .sidebar { top: calc(var(--trialbar) + var(--frame)); height: calc(100svh - var(--trialbar) - 2 * var(--frame)); }

/* ---------- Merlo ---------- */
.merlo { position: fixed; z-index: 66; left: 0; top: 0; width: 76px; height: 76px; pointer-events: none; opacity: 0; transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out), width 300ms var(--ease-out), height 300ms var(--ease-out), opacity 200ms ease; filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 3px 5px rgba(0,0,0,.22)); }
.merlo.on { opacity: 1; }
.merlo.big { width: 112px; height: 112px; }
.merlo .arc { width: 100%; height: 100%; }
.merlo svg { width: 100%; height: 100%; overflow: visible; transition: transform 200ms ease; }
.merlo.flip svg { transform: scaleX(-1); }
.merlo.flying .arc { animation: arc var(--fly) var(--ease-out); }
@keyframes arc { 0% { transform: none; } 45% { transform: translateY(-44px) rotate(-6deg); } 100% { transform: none; } }
.merlo.landing .arc { animation: land 420ms var(--ease-out); }
@keyframes land { 0% { transform: translateY(-12px); } 60% { transform: translateY(2px) scaleY(.94); } 100% { transform: none; } }
.merlo.arrive .arc { animation: arrive 900ms var(--ease-out); }
@keyframes arrive { 0% { transform: translate(-70vw, -50vh) rotate(-14deg); } 80% { transform: translate(0, -8px); } 100% { transform: none; } }
.m-g { transform-box: fill-box; }
.m-tilt { transform-origin: 50% 100%; transition: transform 250ms var(--ease-out); }
.m-bird { transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scaleY(1.025); } }
.m-head { transform-origin: 30% 80%; transition: transform 250ms var(--ease-out); }
.m-wing { transform-origin: 75% 25%; transition: transform 250ms var(--ease-out); }
.m-eye { transform-origin: 50% 50%; animation: blink 4.6s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: none; } 96% { transform: scaleY(.1); } }
.m-dots, .m-brow, .m-drop, .m-confetti { opacity: 0; transition: opacity 200ms ease; }
[data-pose="saluta"] .m-wing { animation: wave .9s ease-in-out infinite; }
@keyframes wave { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-80deg); } }
[data-pose="indica"] .m-tilt { transform: rotate(9deg); }
[data-pose="indica"] .m-head { animation: peck 1.4s ease-in-out infinite; }
@keyframes peck { 0%, 60%, 100% { transform: none; } 75% { transform: translateX(3px) rotate(6deg); } }
[data-pose="pensa"] .m-head { transform: rotate(-12deg); }
[data-pose="pensa"] .m-wing { transform: rotate(-28deg); }
[data-pose="pensa"] .m-dots { opacity: 1; }
[data-pose="pensa"] .m-dots circle { animation: dot 1.5s ease-in-out infinite; }
[data-pose="pensa"] .m-dots circle:nth-child(2) { animation-delay: .2s; }
[data-pose="pensa"] .m-dots circle:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 50% { opacity: .35; } }
[data-pose="preoccupato"] .m-head { transform: rotate(8deg); }
[data-pose="preoccupato"] .m-tilt { transform: translateX(-3px); }
[data-pose="preoccupato"] .m-brow, [data-pose="preoccupato"] .m-drop { opacity: 1; }
[data-pose="preoccupato"] .m-bird { animation: shiver .5s ease-in-out 2; }
@keyframes shiver { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
[data-pose="festeggia"] .m-bird { animation: hop .55s var(--ease-out) infinite; }
@keyframes hop { 0%, 100% { transform: none; } 40% { transform: translateY(-14px) scaleY(1.04); } 80% { transform: scaleY(.95); } }
[data-pose="festeggia"] .m-wing { animation: flap .28s ease-in-out infinite; }
[data-pose="festeggia"] .m-confetti { opacity: 1; }
[data-pose="festeggia"] .m-confetti rect { animation: confetti 1.1s ease-in infinite; transform-box: fill-box; }
[data-pose="festeggia"] .m-confetti rect:nth-child(2n) { animation-delay: .35s; }
[data-pose="festeggia"] .m-confetti rect:nth-child(3n) { animation-delay: .7s; }
@keyframes confetti { 0% { transform: translateY(-6px) rotate(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(26px) rotate(160deg); opacity: 0; } }
.merlo.flying .m-wing { animation: flap .16s linear infinite; }
@keyframes flap { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(-95deg); } }
.merlo.nod .m-head { animation: nod .5s var(--ease-out); }
@keyframes nod { 40% { transform: rotate(14deg); } }

/* ---------- elementi comuni della guida ---------- */
/* il buio intorno è un bordo enorme, non un'ombra: Chrome a volte non disegna le ombre giganti */
.spot { position: fixed; z-index: 55; pointer-events: none; box-sizing: content-box; border: 3000px solid rgba(15, 15, 14, .52); margin: -3000px 0 0 -3000px; transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out), width var(--fly) var(--ease-out), height var(--fly) var(--ease-out), opacity 200ms; }
.ring { position: fixed; z-index: 56; pointer-events: none; border-radius: 10px; border: 2.5px solid var(--black); box-shadow: 0 0 0 3px var(--yellow); transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out), width var(--fly) var(--ease-out), height var(--fly) var(--ease-out); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(255, 217, 0, .55); } }
.ring.okflash { animation: okflash .6s ease-out; border-color: var(--positive); }
@keyframes okflash { from { box-shadow: 0 0 0 0 rgba(36, 123, 80, .6); } to { box-shadow: 0 0 0 16px rgba(36, 123, 80, 0); } }
.arrow { position: fixed; z-index: 56; pointer-events: none; width: 28px; height: 28px; transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out); animation: bob .9s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.say { font-size: 15px; line-height: 22px; min-height: 44px; }
.say b { font-weight: 600; background: linear-gradient(transparent 60%, rgba(255, 217, 0, .6) 60%); }
.say.err { color: #4d3a00; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
.ctl .do { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.ctl .do::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 0 1.5px var(--black); }
.ctl .do.done::before { background: var(--positive); box-shadow: none; }
.who-says { font-size: 12px; font-weight: 600; letter-spacing: .02em; margin-bottom: 4px; }
.pop { animation: pop 280ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }

/* A · fumetto che segue Merlo */
.bubble { position: fixed; z-index: 65; width: 300px; padding: 14px 16px 12px; border: 1.5px solid var(--black); border-radius: 14px; background: var(--surface); box-shadow: 0 12px 32px rgba(0, 0, 0, .2); transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out); }

/* B · taccuino a destra */
.notebook { position: fixed; z-index: 60; right: 0; top: 0; bottom: 0; width: 340px; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); box-shadow: -10px 0 30px rgba(0, 0, 0, .06); transform: translateX(100%); transition: transform 350ms var(--ease-out); }
body.trial .notebook { top: calc(var(--trialbar) + var(--frame)); bottom: var(--frame); right: var(--frame); }
.notebook.on { transform: none; }
.nb-head { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: end; padding: 16px 18px 12px; background: var(--doubt-bg); border-bottom: 1px solid var(--border); min-height: 140px; }
.nb-head .t { font-weight: 600; font-size: 16px; }
.nb-say { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.nb-steps { flex: 1; overflow: auto; list-style: none; margin: 0; padding: 8px 0; }
.nb-steps li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 18px; color: var(--faint); }
.nb-steps li .c { flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--control); display: grid; place-items: center; font-size: 11px; }
.nb-steps li.done { color: var(--muted); }
.nb-steps li.done .c { background: var(--black); border-color: var(--black); color: var(--yellow); }
.nb-steps li.cur { color: var(--text); font-weight: 500; background: var(--raised); }
.nb-steps li.cur .c { border-color: var(--black); box-shadow: inset 0 0 0 3px var(--yellow); }
.nb-foot { display: flex; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--border); }
body.vB.running .app { padding-right: calc(340px + var(--frame)); }
.tag { position: fixed; z-index: 57; pointer-events: none; padding: 2px 8px; border-radius: 4px; background: var(--black); color: var(--yellow); font-size: 12px; font-weight: 500; white-space: nowrap; transition: left var(--fly) var(--ease-out), top var(--fly) var(--ease-out); }

/* C · dialogo in basso */
.dialog { position: fixed; z-index: 60; left: 50%; bottom: 64px; width: min(760px, calc(100% - 48px)); display: grid; grid-template-columns: 120px minmax(0, 1fr); background: var(--black); color: #fff; border: 3px solid var(--yellow); border-radius: 14px; box-shadow: 0 0 0 3px var(--black), 0 18px 40px rgba(0, 0, 0, .3); transform: translate(-50%, 160%); transition: transform 380ms var(--ease-out); }
.dialog.on { transform: translate(-50%, 0); }
.dialog .portrait { background: var(--yellow); border-radius: 11px 0 0 11px; }
.dialog .body { padding: 14px 18px 12px; }
.dialog .who-says { color: var(--yellow); }
.dialog .say b { background: none; color: var(--yellow); }
.dialog .say.err { color: #fff3c2; }
.dialog .link, .dialog .muted { color: #bbb; }
.dialog .ctl .do::before { box-shadow: none; }
.pips { display: flex; gap: 4px; }
.pips i { width: 14px; height: 6px; border-radius: 3px; background: #444; }
.pips i.done { background: var(--yellow); }
.pips i.cur { background: #fff; }
.dialog .caret { display: inline-block; width: 8px; height: 14px; margin-left: 2px; background: var(--yellow); vertical-align: -2px; animation: caret .7s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
body.vC.running .app { padding-bottom: 220px; }

/* schede al centro: invito, "torniamo lì?", telefono, ricompensa */
.scrim { position: fixed; inset: 0; z-index: 62; background: rgba(15, 15, 14, .45); display: grid; place-items: center; padding: 24px; opacity: 0; pointer-events: none; transition: opacity 250ms ease; }
.scrim.on { opacity: 1; pointer-events: auto; }
.card { position: relative; width: min(440px, 100%); padding: 28px 24px 20px 24px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--black); box-shadow: 0 20px 50px rgba(0, 0, 0, .25); }
.card.withbird { padding-top: 56px; }
.card .eyebrow { font: 500 12px/16px var(--mono); color: var(--muted); }
.card h2 { margin-top: 4px; font-size: 22px; line-height: 28px; }
.card p { margin-top: 8px; color: var(--muted); }
.card .meta { display: flex; gap: 14px; margin-top: 12px; font: 12px/16px var(--mono); color: var(--muted); }
.card .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.card .acts .btn.primary { flex: 1; }
.scrim.on .card { animation: cardin 380ms var(--ease-out); }
@keyframes cardin { from { opacity: 0; transform: translateY(16px) scale(.97); } }

/* ricompensa: pergamena con il timbro */
.reward { width: min(480px, 100%); background: #fffbe5; text-align: center; }
.reward h2 { font-size: 24px; }
.stamp { width: 132px; height: 132px; margin: 6px auto 4px; }
.scrim.on .stamp { animation: stamp 700ms cubic-bezier(.2, 1.4, .4, 1) 300ms both; }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-28deg); } 60% { opacity: 1; transform: scale(.94) rotate(-6deg); } 100% { opacity: 1; transform: scale(1) rotate(-8deg); } }
.scrim.on .reward { animation: cardin 380ms var(--ease-out), thud 260ms ease-out 720ms; }
@keyframes thud { 40% { transform: translateY(3px); } }
.ink { position: absolute; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 2px solid var(--black); opacity: 0; pointer-events: none; }
.scrim.on .ink { animation: ink 600ms ease-out 720ms; }
@keyframes ink { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.8); } }
.stampwrap { position: relative; }

/* ---------- movimento ridotto: pose fisse, solo dissolvenze ---------- */
body.rm .merlo, body.rm .merlo *, body.rm .ring, body.rm .arrow, body.rm .stamp, body.rm .reward, body.rm .card, body.rm .pop, body.rm .ink { animation: none !important; }
body.rm .merlo, body.rm .spot, body.rm .ring, body.rm .bubble, body.rm .arrow, body.rm .tag { transition: opacity 200ms ease !important; }
body.rm .notebook, body.rm .dialog, body.rm .trialbar { transition: none; }
body.rm .scrim.on .stamp { transform: rotate(-8deg); }
body.rm .ring { box-shadow: 0 0 0 4px var(--yellow); }
body.rm .dialog .caret { display: none; }
body.rm .fade { animation: fade 250ms ease; }
@keyframes fade { from { opacity: 0; } }

/* ---------- barra del prototipo (estranea al design) ---------- */
.proto { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 6px; border-radius: 20px; background: #2a2a28; color: #eee; font: 12px/1 var(--font); border: 1px solid #000; white-space: nowrap; max-width: calc(100% - 16px); overflow-x: auto; }
.proto button { height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: #444441; color: #fff; font: inherit; cursor: pointer; }
.proto button[aria-pressed="true"] { background: var(--yellow); color: #000; }
.proto .lbl { padding: 0 6px; font-weight: 600; }
.proto .st { color: #bbb; font-family: var(--mono); padding: 0 4px; }

/* ---------- telefono: tutte le varianti diventano un foglio in basso ---------- */
.sheet { position: fixed; z-index: 64; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(52px + env(safe-area-inset-bottom)) 96px; background: var(--surface); border-top: 2px solid var(--black); border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .18); transform: translateY(110%); transition: transform 320ms var(--ease-out); }
.sheet.on { transform: none; }
.sheet .track { margin: 0 0 10px; }
@media (max-width: 1099px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topnav { position: sticky; top: 0; z-index: 20; display: flex; gap: 4px; padding: 8px 12px; overflow-x: auto; background: var(--ground); border-bottom: 1px solid var(--border); }
  body.trial .topnav { top: calc(var(--trialbar) + var(--frame)); }
  .topnav .nav-item { width: auto; flex: none; }
  .row { grid-template-columns: 48px minmax(0, 1fr) 170px 92px 76px; }
  .row .st { display: none; }
}
@media (max-width: 760px) {
  :root { --pad: 16px; --card-pad: 16px; --trialbar: 36px; }
  .title h1 { font-size: 22px; line-height: 28px; }
  .trialbar { font-size: 12px; gap: 8px; }
  .trialbar .full { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who money" "tip acts"; gap: 6px 12px; padding: 10px var(--card-pad); }
  .row .d { display: none; }
  .row > .wd { grid-area: who; } .row > .money { grid-area: money; } .row > .tip { grid-area: tip; } .row > .rbs { grid-area: acts; }
  .rb { width: 40px; height: 40px; }
  .mission { grid-template-columns: 36px minmax(0, 1fr); }
  .mission > :last-child { grid-column: 2; justify-self: start; }
  body.running .app { padding-bottom: 260px; }
  .bubble, .notebook, .dialog, .tag { display: none !important; }
  .proto .st, .proto .hide-phone { display: none; }
  .proto { bottom: 8px; }
}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>
<div class="trialbar" role="region" aria-label="Spazio di prova">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14 14 2M2 9l7-7M7 14l7-7" stroke="#ffd900" stroke-width="2"/></svg>
  <span><b>Stai facendo pratica</b><span class="full">: nessun dato vero</span></span>

</div>

<div class="app">

    <div class="brand"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#ffd900"/><path d="M9 21V10H8V7h2v1.5h1.5V7h3v1.5H16V7h2v3h-1v11z" fill="#0f0f0e"/><rect x="12" y="15" width="2" height="6" fill="#ffd900"/></svg>Prima nota</div>
    <div class="scope"><div id="scopeName">Contrada La Torre APS</div><div class="small muted" id="scopeSub">Esercizio 2026 · aperto</div></div>

<!-- guida: elementi persistenti, così Merlo, l'anello e il fumetto possono spostarsi con una transizione -->
<div class="spot" id="spot" hidden></div>
<div class="ring" id="ring" hidden></div>
<div class="arrow" id="arrow" hidden aria-hidden="true"><svg viewBox="0 0 28 28" width="28" height="28"><path d="M14 26 3 12h7V2h8v10h7z" fill="#ffd900" stroke="#0f0f0e" stroke-width="2" stroke-linejoin="round"/></svg></div>
<div class="tag" id="tag" hidden aria-hidden="true">← qui</div>
<div class="bubble" id="bubble" hidden role="dialog" aria-label="Merlo"></div>

<div class="dialog" id="dialog" role="dialog" aria-label="Merlo"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Merlo"></div>

<div class="merlo" id="merlo" aria-hidden="true"><div class="arc">
  <svg viewBox="0 0 120 120">
    <g class="m-g m-tilt"><g class="m-g m-bird">
      <path d="M40 74 8 90l6 8 32-14z" fill="#0f0f0e"/>
      <path d="M54 93v11m-5 0h10M68 93v11m-5 0h10" stroke="#ffd900" stroke-width="3" stroke-linecap="round" fill="none"/>
      <ellipse cx="60" cy="72" rx="30" ry="25" fill="#0f0f0e"/>
      <g class="m-g m-head">
        <circle cx="74" cy="44" r="19" fill="#0f0f0e"/>
        <path d="M89 40 111 47 89 54z" fill="#ffd900" stroke="#0f0f0e" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M89 47h14" stroke="#0f0f0e" stroke-width="1.2"/>
        <circle cx="79" cy="39" r="6.5" fill="#ffd900"/>
        <g class="m-g m-eye"><circle cx="80" cy="39" r="3.4" fill="#0f0f0e"/><circle cx="81.2" cy="37.8" r="1.1" fill="#fff"/></g>
        <path class="m-brow" d="M71 28.5 85 32" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path class="m-g m-wing" d="M42 66c8-11 30-10 35 3-6 13-26 15-37 9z" fill="#2c2c2a" stroke="#fff" stroke-opacity=".25"/>
    </g></g>
    <g class="m-dots" fill="#fff" stroke="#0f0f0e" stroke-width="1.5"><circle cx="97" cy="24" r="2.6"/><circle cx="104" cy="14" r="3.4"/><circle cx="113" cy="3" r="4.4"/></g>
    <path class="m-drop" d="M52 20c4 6 4 10 0 11-4-1-4-5 0-11z" fill="#fff" stroke="#0f0f0e" stroke-width="1.5"/>
    <g class="m-confetti" stroke="#0f0f0e" stroke-width=".8"><rect x="18" y="10" width="6" height="3" fill="#ffd900"/><rect x="34" y="2" width="5" height="3" fill="#fff"/><rect x="96" y="6" width="6" height="3" fill="#ffd900"/><rect x="108" y="20" width="5" height="3" fill="#0f0f0e"/><rect x="8" y="30" width="5" height="3" fill="#fff"/><rect x="58" y="0" width="6" height="3" fill="#ffd900"/></g>
  </svg>
</div></div>

<div class="proto" role="toolbar" aria-label="Barra del prototipo">
  <button data-proto="prev" aria-label="Variante precedente">←</button>
  <span class="lbl" id="pvLabel"></span>
  <button data-proto="next" aria-label="Variante successiva">→</button>
  <button data-proto="mode" id="pMode" title="Prima volta: con le animazioni di ingresso. Rifatta: versione rapida."></button>
  <button data-proto="rm" id="pRm" aria-pressed="false"><span class="hide-phone">Movimento </span>ridotto</button>
  <button data-proto="reset" title="Ricomincia da capo">⟲</button>
  <span class="st" id="pState"></span>
</div>

<script>
/* ---------- dati inventati ---------- */
const TIPS = { quote: 'Quote associative', beni: 'Acquisto di beni', servizi: 'Acquisto di servizi', utenze: 'Utenze', oneri: 'Oneri bancari' };
const CONTI = { ca: 'Conto corrente Crédit Agricole', pp: 'PayPal', sp: 'Satispay' };
const freshRows = () => [
  { id: 'r1', d: '03/10', who: 'Maria Esempi', desc: 'BONIFICO A VOSTRO FAVORE · quota 2026', amt: 30, tip: 'quote', st: 'prop', g: 1 },
  { id: 'r2', d: '05/10', who: 'Luca Provini', desc: 'BONIFICO A VOSTRO FAVORE · quota sociale', amt: 30, tip: 'quote', st: 'prop', g: 1 },
  { id: 'r3', d: '10/10', who: 'Luce Finta spa', desc: 'PAGAMENTO PREAUTORIZZATO UTENZA', amt: -84.2, tip: 'utenze', st: 'prop', g: 1 },
  { id: 'r4', d: '31/10', who: 'Banca', desc: 'COMMISSIONI TENUTA CONTO', amt: -6.5, tip: 'oneri', st: 'prop', g: 1 },
  { id: 'r5', d: '18/10', who: 'Market Finto', desc: 'PAGAMENTO TRAMITE POS · cena dei soci', amt: -112.65, tip: '', st: 'todo' },
  { id: 'r6', d: '22/10', who: 'Tipografia Immaginaria', desc: 'BONIFICO DISPOSTO · stampa manifesti, fattura non indicata', amt: -640, tip: 'servizi', st: 'prop' },
];

/* ---------- la missione: come sarebbe nel file YAML (schermata, elemento, posa, frase) ---------- */
const STEPS = [
  { kind: 'info', screen: 'import', target: '[data-nav="import"]:not([hidden])', pose: 'indica', short: 'Dove si importa', text: 'Gli estratti conto entrano da <b>Import</b>. Ti ho già portato qui.' },
  { kind: 'do', screen: 'import', target: '#conto', pose: 'indica', short: 'Scegli il conto', text: 'Scegli il conto: l\'estratto di prova è del <b>conto corrente Crédit Agricole</b>.', done: () => S.conto === 'ca' },
  { kind: 'do', screen: 'import', target: '#carica', pose: 'indica', short: 'Carica l\'estratto', text: 'Ora carica l\'estratto di prova. Sono movimenti inventati: sbaglia pure.', done: () => S.loaded },
  { kind: 'info', screen: 'revisione', target: '#ledger', pose: 'pensa', short: 'Controlla il saldo', text: 'Prima guarda la <b>catena del saldo</b>: se il saldo finale è uguale all\'estratto, non manca nessun movimento.' },
  { kind: 'do', screen: 'revisione', target: '#group', pose: 'indica', short: 'Conferma le proposte', text: 'Queste quattro proposte sono pronte. Dagli un\'occhiata e <b>confermale insieme</b>.', done: () => S.groupDone },
  { kind: 'do', screen: 'revisione', target: '[data-row="r5"] select', pose: 'pensa', short: 'Scegli la tipologia', text: 'Qui manca la <b>tipologia</b>. Una spesa al Market Finto per la cena dei soci: che cos\'è?', done: () => row('r5').tip === 'beni' },
  { kind: 'do', screen: 'revisione', target: '[data-row="r5"] .rb.ok', pose: 'indica', short: 'Conferma il movimento', text: 'Giusto, acquisto di beni. Ora confermalo con la <b>spunta</b>.', done: () => row('r5').st === 'ok' },
  { kind: 'do', screen: 'revisione', target: '[data-row="r6"] .rb.q', pose: 'pensa', short: 'Segnala un dubbio', text: '640 € alla tipografia, ma la fattura non c\'è. Segnalalo come <b>dubbio</b> col punto interrogativo.', done: () => row('r6').st === 'dubbio' },
  { kind: 'info', screen: 'revisione', target: '#progress', pose: 'saluta', short: 'Il punto della situazione', text: 'Ecco fatto: 5 confermati e 1 dubbio. Il dubbio resta aperto finché qualcuno non lo chiarisce.' },
];
const OKS = ['Bene così.', 'Esatto.', 'Perfetto.', 'Ci siamo.'];

/* ---------- stato (solo in memoria) ---------- */
const params = new URLSearchParams(location.search);
const VARIANTS = { A: 'Volo', B: 'Taccuino', C: 'Dialogo' };
const S = {
  variant: VARIANTS[params.get('variant')] ? params.get('variant') : 'A',
  rapida: params.get('mode') === 'rapida',
  rmForced: params.get('rm') === '1',
  screen: 'impara', conto: '', loading: false, loaded: false, rows: freshRows(), groupDone: false,
  status: 'idle',   // idle | phone | intro | running | away | reward | paused | skipped | done
  step: 0, err: null, ok: false, awayTo: null, phoneOk: false, stamp: false,
};
const row = id => S.rows.find(r => r.id === id);
const cur = () => STEPS[S.step];
const isPhone = () => matchMedia('(max-width: 760px)').matches;
const rm = () => S.rmForced || matchMedia('(prefers-reduced-motion: reduce)').matches;
const eur = n => (n < 0 ? '−' : '+') + Math.abs(n).toLocaleString('it-IT', { minimumFractionDigits: 2 }) + ' €';
const eur0 = n => n.toLocaleString('it-IT', { minimumFractionDigits: 2 });
const $ = s => document.querySelector(s);

/* ---------- icone ---------- */
const I = {
  impara: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 14V6H3V3h2v1.5h1.5V3h3v1.5H11V3h2v3h-1v8z"/></svg>',
  import: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v8m-3-3 3 3 3-3M3 13h10"/></svg>',
  revisione: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4h10M3 8h10M3 12h6"/></svg>',
  report: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13V8m5 5V3m5 10V6"/></svg>',
  ok: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 8.5 3 3 7-7"/></svg>',
  q: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6a2 2 0 1 1 3 1.7c-.7.4-1 .9-1 1.6"/><circle cx="8" cy="12.3" r=".4" fill="currentColor"/></svg>',
  file: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2h7l4 4v12H5z M12 2v4h4"/></svg>',
};

/* ---------- schermate dell'app (nella prova) ---------- */
function renderNav() {
  const items = [['impara', 'Impara'], ['import', 'Import'], ['revisione', 'Revisione'], ['report', 'Report']];
  const html = items.map(([k, l]) => `<button class="nav-item" data-nav="${k}" ${S.screen === k ? 'aria-current="page"' : ''}>${I[k]}<span>${l}</span>${k === 'revisione' && S.loaded ? `<span class="count">${S.rows.filter(r => r.st !== 'ok').length}</span>` : ''}</button>`).join('');
  document.querySelectorAll('.navlist').forEach(n => n.innerHTML = html);
  // il selettore del passo 1 cerca la voce visibile: nella barra in alto sotto i 1100 px, nel menu laterale sopra
  const side = matchMedia('(max-width: 1099px)').matches ? '.sidebar' : '.topnav';
  document.querySelectorAll(side + ' [data-nav]').forEach(b => b.hidden = true);
  const trial = ['intro', 'running', 'away', 'reward', 'phone'].includes(S.status);
  $('#scopeName').textContent = trial ? 'Spazio di prova' : 'Contrada La Torre APS';
  $('#scopeSub').textContent = trial ? 'Scenario: import di ottobre' : 'Esercizio 2026 · aperto';
}

function screenImpara() {
  const list = [
    ['Benvenuto', 'done'], ['Import e revisione', 'this'], ['Classificazione e regole', 'later'], ['Movimenti di cassa e conta di cassa', 'later'],
    ['Giroconti', 'later'], ['Report e Modello D', 'later'], ['Chiusura, approvazione e deposito', 'lock'],
  ];
  const stamps = 1 + (S.stamp ? 1 : 0);
  let action = `<button class="btn primary sm" data-act="start">Inizia</button>`;
  if (S.status === 'paused') action = `<button class="btn primary sm" data-act="resume">Riprendi dal passo ${S.step + 1}</button>`;
  if (S.stamp) action = `<button class="btn sm" data-act="rifai">Rifalla</button>`;
  return `
  <div class="title"><h1>Impara</h1><p>Percorso del Tesoriere · ${stamps} di 7 timbri</p></div>
  ${S.status === 'skipped' ? `<div class="banner">Hai saltato <b>Import e revisione</b>: niente timbro, resta qui tra le suggerite.</div>` : ''}
  ${S.status === 'paused' ? `<div class="banner">Missione interrotta al passo ${S.step + 1} di ${STEPS.length}. Riprende da lì quando vuoi.</div>` : ''}
  <section class="panel">
    <div class="panel-head"><h2>Percorso del Tesoriere</h2><span class="spacer"></span><span class="small muted">3–5 minuti a missione</span></div>
    <ol class="missions">${list.map(([t, k], i) => {
      const done = k === 'done' || (k === 'this' && S.stamp);
      return `<li class="mission ${done ? 'done' : ''} ${k === 'this' && !S.stamp ? 'next' : ''} ${k === 'later' || k === 'lock' ? 'later' : ''}">
        <span class="n">${done ? '✓' : i + 1}</span>
        <span><span class="t">${t}</span><span class="small muted" style="display:block">${k === 'lock' ? 'Si sblocca per ultima' : done ? 'Timbro ottenuto' : k === 'this' ? 'Carichi un estratto di prova e confermi i primi movimenti' : 'Dopo'}</span></span>
        <span>${k === 'this' ? action : ''}</span></li>`;
    }).join('')}</ol>
    <div class="parchment" aria-label="Timbri">${stampSvg('Benvenuto', 64)}${S.stamp ? stampSvg('Import', 64) : '<span class="slot"></span>'}${'<span class="slot"></span>'.repeat(5)}</div>
  </section>`;
}

function screenImport() {
  return `
  <div class="title"><h1>Importa un estratto conto</h1><p>Carichi il file esportato dalla banca, da PayPal o da Satispay; poi lo rivedi movimento per movimento.</p></div>
  <section class="panel"><div class="panel-head"><h2>Nuovo import</h2></div>
    <div class="imp">
      <div class="field"><label for="conto">Conto</label>
        <select id="conto"><option value="">Scegli il conto…</option>${Object.entries(CONTI).map(([k, v]) => `<option value="${k}" ${S.conto === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="drop">
        <div class="file">${I.file}<span>estratto_CA_ottobre_PROVA.csv<br><span class="muted">6 movimenti · inventati</span></span></div>
        ${S.loading ? `<div class="loading"><span class="spin"></span>Lettura dell'estratto…</div>` : `<button class="btn primary" id="carica" data-act="carica">Carica l'estratto di prova</button>`}
      </div>
    </div></section>`;
}

function screenRevisione() {
  if (!S.loaded) return `<div class="title"><h1>Revisione</h1><p>Nessun import da rivedere. Carica un estratto da Import.</p></div>`;
  const ent = S.rows.filter(r => r.amt > 0).reduce((a, r) => a + r.amt, 0);
  const usc = -S.rows.filter(r => r.amt < 0).reduce((a, r) => a + r.amt, 0);
  const ini = 3412.8, fin = ini + ent - usc;
  const ok = S.rows.filter(r => r.st === 'ok').length, dub = S.rows.filter(r => r.st === 'dubbio').length;
  const grp = S.rows.filter(r => r.g), rest = S.rows.filter(r => !r.g);
  return `
  <div class="title"><h1>Revisione · Conto corrente, ottobre 2026</h1><p>Il saldo torna con l'estratto. Restano ${S.rows.length - ok} movimenti da decidere.</p></div>
  <section class="panel">
    <div class="ledger" id="ledger">
      <div><div class="k">Saldo iniziale</div><div class="v">${eur0(ini)}</div></div>
      <div><div class="k">Entrate</div><div class="v"><span class="op">+</span>${eur0(ent)}</div></div>
      <div><div class="k">Uscite</div><div class="v"><span class="op">−</span>${eur0(usc)}</div></div>
      <div class="tot"><div class="k">Saldo finale</div><div class="v"><span class="op">=</span>${eur0(fin)}</div></div>

    <div class="progress" id="progress"><div class="k"><span>Confermati ${ok} di ${S.rows.length}${dub ? ` · ${dub} in dubbio` : ''}</span><span class="num">${Math.round(ok / S.rows.length * 100)}%</span></div><div class="track"><span style="width:${ok / S.rows.length * 100}%"></span></div></div>
  </section>
  <section class="panel">

}

function rowHtml(r) {

function screenReport() {

function stampSvg(label, size = 132) {

/* ---------- guida: contenuti ---------- */
function sayHtml() {
  const st = cur();
  if (S.err) return `<p class="say err" aria-live="polite">${S.err}</p>`;
  if (S.ok) return `<p class="say" aria-live="polite">${OKS[S.step % OKS.length]}</p>`;
  return `<p class="say" aria-live="polite">${st.text}</p>`;
}
function ctlHtml(dark) {
  const st = cur(), last = S.step === STEPS.length - 1;
  const right = st.kind === 'info'
    ? `<button class="btn ${dark ? 'primary' : 'primary'} sm" data-act="avanti">${last ? 'Finito' : 'Avanti'}</button>`
    : `<span class="small do ${S.ok ? 'done' : ''}">${S.ok ? 'Fatto' : 'Tocca a te'}</span>`;

}
const trackHtml = () => `<div class="track"><span style="width:${(S.step + (S.ok ? 1 : 0)) / STEPS.length * 100}%"></span></div>`;

/* ---------- render ---------- */
let lastKey = '', lastStepShown = -1, typer = null;
function render() {
  const b = document.body;
  b.classList.toggle('rm', rm());
  b.classList.toggle('rapida', S.rapida);
  b.classList.remove('vA', 'vB', 'vC'); b.classList.add('v' + S.variant);
  b.classList.toggle('trial', ['intro', 'running', 'away', 'reward', 'phone'].includes(S.status));
  b.classList.toggle('running', S.status === 'running');
  renderNav();
  // il canvas si ridisegna a ogni azione: si rimette il focus dov'era
  const a = document.activeElement, fsel = a?.id ? '#' + a.id : a?.dataset?.tip ? `[data-tip="${a.dataset.tip}"]` : a?.dataset?.id ? `[data-act="${a.dataset.act}"][data-id="${a.dataset.id}"]` : null;
  $('#canvas').innerHTML = { impara: screenImpara, import: screenImport, revisione: screenRevisione, report: screenReport }[S.screen]();
  if (fsel && $('#canvas').contains(document.querySelector(fsel))) document.querySelector(fsel).focus({ preventScroll: true });
  renderGuide();
  place(); renderProto();
  requestAnimationFrame(() => { place(); renderProto(); }); // di nuovo dopo le animazioni d'ingresso delle schede
}

function renderGuide() {
  const running = S.status === 'running', phone = isPhone(), v = S.variant;
  const key = [S.status, S.step, S.err, S.ok, v, phone, S.rapida].join('|');
  const changed = key !== lastKey; lastKey = key;
  const show = (id, on) => $(id).toggleAttribute('hidden', !on);

  // barra della prova: avanzamento solo in A (in B e C sta nella guida)
  $('#tbProgress').innerHTML = running && v === 'A' && !phone ? `<span class="small">Import e revisione</span>${trackHtml()}<span class="num">${S.step + 1}/${STEPS.length}</span>` : '';

  show('#spot', running && v === 'A');
  show('#ring', running);
  show('#arrow', running && v === 'C' && !phone);
  show('#tag', running && v === 'B' && !phone);
  show('#bubble', running && v === 'A' && !phone);
  $('#notebook').classList.toggle('on', running && v === 'B' && !phone);
  $('#dialog').classList.toggle('on', running && v === 'C' && !phone);
  $('#sheet').classList.toggle('on', running && phone);

  if (changed && running) {
    const fresh = S.step !== lastStepShown;
    if (v === 'A' && !phone) {
      $('#bubble').innerHTML = `<div class="${fresh || S.err ? 'pop fade' : ''}"><div class="who-says">Merlo</div>${sayHtml()}${ctlHtml()}</div>`;
    }

        <div class="nb-head"><span></span><div><div class="small muted">Missione · Percorso del Tesoriere</div><div class="t">Import e revisione</div>${trackHtml()}<div class="small muted num" style="margin-top:6px">passo ${S.step + 1} di ${STEPS.length}</div></div></div>
        <div class="nb-say ${fresh || S.err ? 'pop fade' : ''}"><div class="who-says">Merlo</div>${sayHtml()}${cur().kind === 'info' ? `<div class="ctl"><span class="spacer"></span><button class="btn primary sm" data-act="avanti">${S.step === STEPS.length - 1 ? 'Finito' : 'Avanti'}</button></div>` : `<div class="ctl"><span class="small do ${S.ok ? 'done' : ''}">${S.ok ? 'Fatto' : 'Tocca a te'}</span></div>`}</div>
        <ol class="nb-steps">${STEPS.map((s, i) => `<li class="${i < S.step || (i === S.step && S.ok) ? 'done' : ''} ${i === S.step ? 'cur' : ''}"><span class="c">${i < S.step || (i === S.step && S.ok) ? '✓' : ''}</span>${s.short}</li>`).join('')}</ol>
        <div class="nb-foot"><button class="link small" data-act="interrompi">Interrompi</button><button class="link small" data-act="salta">Salta missione</button></div>`;
    }
    if (v === 'C' && !phone) {
      $('#dialog').innerHTML = `<div class="portrait"></div><div class="body"><div class="who-says" style="display:flex;gap:12px;align-items:center">MERLO <span class="pips">${STEPS.map((s, i) => `<i class="${i < S.step || (i === S.step && S.ok) ? 'done' : i === S.step ? 'cur' : ''}"></i>`).join('')}</span></div>${sayHtml()}${ctlHtml(true)}</div>`;
      typeText($('#dialog .say'));
    }
    if (phone) {
      $('#sheet').innerHTML = `${trackHtml()}<div class="${fresh || S.err ? 'pop fade' : ''}"><div class="who-says">Merlo · passo ${S.step + 1} di ${STEPS.length}</div>${sayHtml()}${ctlHtml()}</div>`;
    }
    if (fresh) focusStep();
    lastStepShown = S.step;
  }
  if (changed) renderCenter();
}

// C: il testo si scrive da solo (solo la prima volta e senza movimento ridotto); un clic lo completa
function typeText(el) {
  clearInterval(typer);
  if (!el || S.rapida || rm() || S.ok) return;
  const html = el.innerHTML, plain = el.textContent; let i = 0;
  el.textContent = ''; const caret = document.createElement('span'); caret.className = 'caret';
  const tick = () => { i += 2; el.textContent = plain.slice(0, i); el.appendChild(caret); if (i >= plain.length) finish(); };
  const finish = () => { clearInterval(typer); el.innerHTML = html; $('#dialog').onclick = null; };
  typer = setInterval(tick, 22);
  $('#dialog').onclick = finish;
}

function renderCenter() {
  const sc = $('#scrim'); const s = S.status;
  let html = '';
  if (s === 'intro') html = `<div class="card withbird" role="dialog" aria-labelledby="ci">
      <div class="eyebrow">Missione 2 · Percorso del Tesoriere</div><h2 id="ci">Import e revisione</h2>
      <p>Carichi un estratto conto di prova e confermi i primi movimenti. Tutto succede nello spazio di prova: niente di quello che fai tocca i dati veri.</p>
      <div class="meta"><span>~4 minuti</span><span>${STEPS.length} passi</span><span>timbro alla fine</span></div>
      <div class="acts"><button class="btn primary" data-act="go">Iniziamo</button><button class="btn" data-act="notnow">Non ora</button></div></div>`;
  if (s === 'away') html = `<div class="card withbird" role="dialog" aria-labelledby="ca">
      <h2 id="ca">Torniamo lì?</h2><p>Eravamo su <b>${{ import: 'Import', revisione: 'Revisione' }[cur().screen]}</b>, al passo ${S.step + 1} di ${STEPS.length}. Se vuoi restare qui, interrompo la missione e la riprendi quando vuoi.</p>
      <div class="acts"><button class="btn primary" data-act="back">Sì, torniamo</button><button class="btn" data-act="stay">Resto qui</button></div></div>`;
  if (s === 'phone') html = `<div class="card withbird" role="dialog" aria-labelledby="cp">
      <h2 id="cp">Questa va meglio dal computer</h2><p>Import e revisione hanno tabelle larghe. Puoi riprenderla dal computer, oppure provarla lo stesso da qui.</p>
      <div class="acts"><button class="btn primary" data-act="notnow">Continuo dal computer</button><button class="btn" data-act="phoneok">Provo da qui</button></div></div>`;
  if (s === 'reward') html = `<div class="card reward withbird" role="dialog" aria-labelledby="cr">
      <div class="stampwrap">${stampSvg('Import')}<span class="ink"></span></div>
      <h2 id="cr">Timbro: Import e revisione</h2><p>Hai caricato un estratto, confermato 5 movimenti e segnalato un dubbio. Prossima missione: Classificazione e regole.</p>
      <div class="acts"><button class="btn primary" data-act="toImpara">Torna a Impara</button><button class="btn" data-act="rifai">Rifalla in versione rapida</button></div></div>`;
  sc.innerHTML = html; sc.classList.toggle('on', !!html);
  if (html) setTimeout(() => sc.querySelector('.btn.primary')?.focus({ preventScroll: true }), 50);
}

/* ---------- posizioni: anello, faretto, Merlo, fumetto ---------- */
let prevMerlo = null;
function place() {
  const m = $('#merlo'); const s = S.status, v = S.variant, phone = isPhone();
  let pose = 'saluta', box = null, flip = false, big = false;
  if (['intro', 'away', 'phone', 'reward'].includes(s)) {
    const c = $('#scrim .card'); if (c) { const r = c.getBoundingClientRect(); box = { x: r.left + 14, y: r.top - 48 }; big = s === 'reward' && !phone; if (big) box = { x: r.left - 40, y: r.top - 70 }; }
    pose = s === 'reward' ? 'festeggia' : s === 'away' ? 'pensa' : s === 'phone' ? 'pensa' : 'saluta';
  }
  if (s === 'running') {
    const st = cur(), el = document.querySelector(st.target);
    pose = S.err ? 'preoccupato' : S.ok ? 'festeggia' : st.pose;
    if (el) {
      const r = el.getBoundingClientRect(), p = 6;
      for (const id of ['#ring', '#spot']) Object.assign($(id).style, { left: r.left - p + 'px', top: r.top - p + 'px', width: r.width + 2 * p + 'px', height: r.height + 2 * p + 'px' });
      $('#ring').classList.toggle('okflash', S.ok);
      Object.assign($('#arrow').style, { left: r.left + r.width / 2 - 14 + 'px', top: r.top - 40 + 'px' });
      Object.assign($('#tag').style, { left: r.right + 12 + 'px', top: r.top + r.height / 2 - 11 + 'px' });
      if (v === 'A' && !phone) ({ box, flip } = placeBubble(r));
    }
    if (phone) { const r = $('#sheet').getBoundingClientRect(); box = { x: 10, y: r.top + 4 }; }
    else if (v === 'B') { const r = $('#notebook').getBoundingClientRect(); box = { x: r.left + 10, y: r.top + 22 }; big = true; }
    else if (v === 'C') { const r = $('#dialog').getBoundingClientRect(); box = { x: r.left + 6, y: r.top + 14 }; big = true; }
  }
  m.dataset.pose = pose;
  m.classList.toggle('flip', flip);
  m.classList.toggle('big', big);
  if (!box) { m.classList.remove('on'); prevMerlo = null; return; }
  const moved = !prevMerlo || Math.hypot(prevMerlo.x - box.x, prevMerlo.y - box.y) > 30;
  if (moved && prevMerlo && prevMerlo.step !== S.step + s) fly(m, box);
  else if (!prevMerlo) arrive(m, box);
  else { m.style.left = box.x + 'px'; m.style.top = box.y + 'px'; }
  prevMerlo = { ...box, step: S.step + s };
  m.classList.add('on');
}

// A: Merlo si posa accanto all'elemento, il fumetto accanto a lui; restano dentro lo schermo
function placeBubble(r) {
  const vw = innerWidth, vh = innerHeight, M = 76, W = 300, H = $('#bubble').offsetHeight || 150, top0 = 52;
  let mx, my, bx, by, flip = false;
  if (vw - r.right > M + W + 24) { mx = r.right + 8; my = r.top + r.height / 2 - M / 2; bx = mx + M + 4; by = my - 12; flip = true; }
  else if (vh - r.bottom > H + 24) { mx = Math.max(12, Math.min(r.left, vw - M - W - 20)); my = r.bottom + 10; bx = mx + M + 4; by = my; }
  else { mx = Math.max(12, Math.min(r.left, vw - M - W - 20)); my = r.top - M - 10; bx = mx + M + 4; by = r.top - H - 10; }
  bx = Math.max(12, Math.min(bx, vw - W - 12)); by = Math.max(top0, Math.min(by, vh - H - 70));
  my = Math.max(top0, Math.min(my, vh - M - 70));
  Object.assign($('#bubble').style, { left: bx + 'px', top: by + 'px' });
  return { box: { x: mx, y: my }, flip };
}

function fly(m, box) {
  if (rm()) { // movimento ridotto: niente volo, una dissolvenza
    m.classList.remove('on'); m.style.transition = 'none';
    m.style.left = box.x + 'px'; m.style.top = box.y + 'px';
    requestAnimationFrame(() => { m.style.transition = ''; m.classList.add('on'); });
    return;
  }
  m.classList.remove('landing'); m.classList.add('flying');
  m.style.left = box.x + 'px'; m.style.top = box.y + 'px';
  clearTimeout(m._t); m._t = setTimeout(() => { m.classList.remove('flying'); m.classList.add('landing'); setTimeout(() => m.classList.remove('landing'), 450); }, parseFloat(getComputedStyle(document.body).getPropertyValue('--fly')));
}
function arrive(m, box) {
  m.style.transition = 'none'; m.style.left = box.x + 'px'; m.style.top = box.y + 'px';
  requestAnimationFrame(() => {
    m.style.transition = '';
    if (!rm() && !S.rapida && S.status === 'intro') { m.classList.add('arrive', 'flying'); setTimeout(() => m.classList.remove('arrive', 'flying'), 900); }
  });
}

function focusStep() {
  setTimeout(() => {
    const st = cur(); if (!st || S.status !== 'running') return;
    const el = document.querySelector(st.target);
    if (el) el.scrollIntoView({ block: 'center', behavior: rm() ? 'auto' : 'smooth' });
    const f = st.kind === 'do' ? el : document.querySelector(`#${{ A: 'bubble', B: 'notebook', C: 'dialog' }[S.variant]} [data-act="avanti"], #sheet [data-act="avanti"]`);
    f?.focus({ preventScroll: true });
  }, 60);
}

/* ---------- missione ---------- */
function resetScenario() { Object.assign(S, { conto: '', loading: false, loaded: false, rows: freshRows(), groupDone: false, step: 0, err: null, ok: false }); }
function start() {
  resetScenario(); S.screen = 'import';
  if (isPhone() && !S.phoneOk) { S.status = 'phone'; return render(); }
  S.status = S.rapida ? 'running' : 'intro';
  render();
}
function check() {
  if (S.status !== 'running' || S.ok) return;
  const st = cur();
  if (st.kind === 'do' && st.done()) {
    S.err = null; S.ok = true; render();
    $('#merlo').classList.add('nod'); setTimeout(() => $('#merlo').classList.remove('nod'), 500);
    setTimeout(next, S.rapida ? 450 : 1100);
  }
}
function next() {
  S.ok = false; S.err = null;
  if (S.step >= STEPS.length - 1) { S.status = 'reward'; S.stamp = true; return render(); }
  S.step++; S.screen = cur().screen; render();
  setTimeout(check, 400); // un passo già fatto prima del tempo si chiude da solo
}
function go(screen) {
  if (S.status === 'running' && screen !== cur().screen) { S.awayTo = screen; S.status = 'away'; return render(); }
  S.screen = screen; render(); check();
}
const err = t => { if (S.status === 'running') { S.err = t; render(); } };

/* ---------- eventi ---------- */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]'); if (nav) return go(nav.dataset.nav);
  const p = e.target.closest('[data-proto]'); if (p) return proto(p.dataset.proto);
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, id = a.dataset.id, st = S.status === 'running' ? cur() : null;
  switch (act) {
    case 'start': S.phoneOk = false; return start();
    case 'rifai': S.rapida = true; return start();
    case 'resume': S.status = 'running'; S.screen = cur().screen; lastStepShown = -1; return render();
    case 'go': S.status = 'running'; lastStepShown = -1; return render();
    case 'notnow': S.status = 'idle'; S.screen = 'impara'; return render();
    case 'phoneok': S.phoneOk = true; S.status = S.rapida ? 'running' : 'intro'; return render();
    case 'avanti': return next();
    case 'interrompi': if (['running', 'away', 'intro'].includes(S.status)) { S.status = S.status === 'intro' ? 'idle' : 'paused'; S.err = null; S.screen = 'impara'; } return render();
    case 'salta': S.status = 'skipped'; S.screen = 'impara'; return render();
    case 'back': S.status = 'running'; S.screen = cur().screen; lastStepShown = -1; return render();
    case 'stay': S.status = 'paused'; S.screen = S.awayTo; return render();
    case 'toImpara': S.status = 'done'; S.screen = 'impara'; return render();
    case 'carica':
      if (!S.conto) return err('Manca il conto: sceglilo prima, così so dove mettere i movimenti.');
      if (S.conto !== 'ca') return err('Questo è un estratto della banca, non di ' + CONTI[S.conto] + '. Cambia il conto e riprova.');
      S.err = null; S.loading = true; render();
      return setTimeout(() => { S.loading = false; S.loaded = true; S.screen = 'revisione'; render(); check(); }, S.rapida ? 300 : 900);
    case 'group': S.rows.forEach(r => { if (r.g) r.st = 'ok'; }); S.groupDone = true; S.err = null; render(); return check();
    case 'ok': {
      const r = row(id);
      if (a.getAttribute('aria-disabled') === 'true') return err('Senza tipologia la spunta non va: scegline una prima, dal menu accanto.');
      if (st && id === 'r6') return err('Aspetta: senza fattura meglio non confermare. Usa il <b>punto interrogativo</b>.');
      r.st = 'ok'; S.err = null; render(); return check();
    }
    case 'q': { const r = row(id); r.st = r.st === 'dubbio' ? (r.tip ? 'prop' : 'todo') : 'dubbio'; S.err = null; render(); return check(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'conto') {
    S.conto = e.target.value; S.err = null;
    if (S.conto && S.conto !== 'ca') return err('Quello è ' + CONTI[S.conto] + ': l\'estratto di prova viene dalla banca. Riprova.');
    render(); return check();
  }
  if (e.target.dataset.tip) {
    const r = row(e.target.dataset.tip); r.tip = e.target.value; if (r.st === 'todo' && r.tip) r.st = 'prop';
    S.err = null;
    const wrong = { quote: 'Le quote le versano i soci, e qui i soldi escono. Riprova.', servizi: 'Un servizio è un lavoro fatto per noi; al market hai comprato cose. Riprova.', utenze: 'Le utenze sono luce, gas e telefono. Qui hai comprato cose. Riprova.', oneri: 'Gli oneri bancari sono le commissioni della banca. Riprova.' };
    if (r.id === 'r5' && S.status === 'running' && cur().target.includes('r5') && wrong[r.tip]) return err(wrong[r.tip]);
    render(); return check();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.status === 'running') { S.status = 'paused'; S.screen = 'impara'; return render(); }
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') proto('prev');
  if (e.key === 'ArrowRight') proto('next');
});
let raf; const replace = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(place); };
addEventListener('scroll', replace, { passive: true });
// Merlo segue i pannelli che entrano scorrendo (taccuino, dialogo, foglio)
for (const id of ['#notebook', '#dialog', '#sheet']) $(id).addEventListener('transitionend', e => { if (e.target === e.currentTarget) replace(); });
addEventListener('resize', () => { lastKey = ''; render(); });

/* ---------- barra del prototipo ---------- */
function proto(k) {
  const keys = Object.keys(VARIANTS), i = keys.indexOf(S.variant);
  if (k === 'prev') S.variant = keys[(i + keys.length - 1) % keys.length];
  if (k === 'next') S.variant = keys[(i + 1) % keys.length];
  if (k === 'mode') S.rapida = !S.rapida;
  if (k === 'rm') S.rmForced = !S.rmForced;
  if (k === 'reset') { resetScenario(); Object.assign(S, { status: 'idle', screen: 'impara', stamp: false, phoneOk: false }); }
  const q = new URLSearchParams({ variant: S.variant }); if (S.rapida) q.set('mode', 'rapida'); if (S.rmForced) q.set('rm', '1');
  try { history.replaceState(null, '', '?' + q); } catch { /* anteprima senza indirizzo */ }
  lastKey = ''; prevMerlo = null; lastStepShown = -1; render();
}
function renderProto() {
  $('#pvLabel').textContent = `${S.variant} · ${VARIANTS[S.variant]}`;
  $('#pMode').textContent = S.rapida ? 'Rifatta (rapida)' : 'Prima volta';
  $('#pRm').setAttribute('aria-pressed', rm());
  const st = S.status === 'running' ? ` · passo ${S.step + 1}/${STEPS.length} · ${$('#merlo').dataset.pose || ''}` : '';
  $('#pState').textContent = `${S.status} · ${S.screen}${st}`;
}

render();
</script>
