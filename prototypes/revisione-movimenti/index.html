<!doctype html>
<!--
  PROTOTIPO USA E GETTA — ticket #20 "Schermata di revisione dei movimenti importati".
  Tre varianti della stessa schermata, scelte con ?variant=A|B|C o con la barra in basso (frecce ← →).
  Dati inventati, nessun dato reale. Stato solo in memoria: ricaricare la pagina riparte da capo.
  Non va in produzione: vive sul branch prototype/revisione-movimenti.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · Revisione import</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Colori della contrada: giallo (CMYK 0/15/100/0 = #FFD900) e nero, bianco complementare. Mai rosso. */
  --yellow: #ffd900; --yellow-hover: #f0cc00; --yellow-tint: #fff7cc; --yellow-soft: #fffbe5;
  --ground: #f6f6f4; --surface: #ffffff; --raised: #ececea; --border: #e2e2df; --rule: #eeeeeb; --control: #cfcfcb;
  --text: #0a0a0a; --muted: #5f5f5b; --accent: #0a0a0a;
  --pill-ok-bg: #0a0a0a; --pill-ok-ink: #ffd900;
  --pill-warn-bg: #ffd900; --pill-warn-ink: #0a0a0a;
  --pill-neutral-bg: #ececea; --pill-neutral-ink: #333330;
  --radius-card: 8px; --radius-control: 6px; --gap: 12px; --pad: 24px; --control-height: 36px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 400 14px/1.45 "Geist", Inter, system-ui, sans-serif; color: var(--text); background: var(--ground); }
.num, .money { font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.money { font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
button { font: inherit; cursor: pointer; }
select, input { font: inherit; height: var(--control-height); border: 1px solid var(--control); border-radius: var(--radius-control); background: #fff; padding: 0 10px; color: var(--text); min-width: 0; }
select:focus, input:focus, button:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.btn { height: var(--control-height); padding: 0 14px; border-radius: var(--radius-control); border: 1px solid transparent; white-space: nowrap; }
.btn-primary { background: var(--yellow); color: var(--text); border-color: var(--text); font-weight: 500; }
.btn-primary:hover { background: var(--yellow-hover); }
.btn-secondary { background: var(--raised); color: var(--text); }
.btn-secondary:hover { background: #e0e0dd; }
.btn-ghost { background: transparent; border-color: var(--control); color: var(--text); }
.btn-ghost:hover { background: var(--raised); }
.btn:disabled { opacity: .45; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.pill { display: inline-block; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 10px; background: var(--pill-neutral-bg); color: var(--pill-neutral-ink); white-space: nowrap; }
.pill.ok { background: var(--pill-ok-bg); color: var(--pill-ok-ink); }
.pill.warn { background: var(--pill-warn-bg); color: var(--pill-warn-ink); }
.in { color: var(--text); }

/* Shell: sidebar con etichette (scelta motivata: tesorieri alle prime armi) */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px; }
.brand b { font-weight: 500; white-space: nowrap; }
.scope { margin: 8px 8px 18px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-control); background: var(--surface); font-size: 13px; }
.nav a { display: flex; justify-content: space-between; align-items: center; height: 32px; padding: 0 10px; margin: 1px 0; border-radius: 8px; color: #4b4d52; text-decoration: none; }
.nav a.on { background: var(--yellow); color: var(--text); font-weight: 500; }
.nav a.on .count { color: var(--text); }
.nav a .count { font-size: 12px; color: var(--muted); }
.nav .grp { font-size: 12px; color: var(--muted); padding: 18px 10px 6px; }
.side .foot { margin-top: auto; }
.main { padding: 28px 32px 96px; min-width: 0; }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
h1 { font-size: 24px; font-weight: 500; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 500; margin: 0; }
.finding { margin: 0; color: var(--text); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); }

/* Striscia di riconciliazione (elemento proprio del prodotto) */
.recon { display: grid; grid-template-columns: repeat(4, auto) 1fr; align-items: end; gap: 28px; padding: 16px var(--pad); margin-bottom: var(--gap); }
.recon .k { font-size: 12px; color: var(--muted); }
.recon .v { font-size: 18px; }
.recon .ok-line { justify-self: end; text-align: right; }
.progress { height: 8px; background: var(--surface); border: 1px solid var(--text); border-radius: 4px; overflow: hidden; margin-top: 8px; width: 220px; margin-left: auto; }
.progress span { display: block; height: 100%; background: var(--yellow); }

/* Variante A: coda + dettaglio */
.qa { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: var(--gap); align-items: start; }
.qa > * { min-width: 0; }
.detail { position: sticky; top: 16px; }
.wrap-btn { white-space: normal; height: auto; min-height: var(--control-height); padding: 8px 14px; text-align: left; }
.list { overflow: hidden; }
.list .grp-h { display: flex; justify-content: space-between; padding: 14px 16px 6px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--rule); }
.list .grp-h:first-child { border-top: 0; }
.row { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border: 0; background: none; width: 100%; text-align: left; border-top: 1px solid var(--rule); color: var(--text); }
.row:hover { background: var(--yellow-soft); }
.row { position: relative; }
.row.sel { background: var(--yellow-tint); }
.row.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--text); }
.row .d { font-size: 12px; color: var(--muted); }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .src { font-size: 12px; color: var(--muted); }
.row .a { text-align: right; }
.row.done .t, .row.done .a { color: var(--muted); }
.detail { padding: var(--pad); }
.detail .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
.detail .amount { font-size: 30px; line-height: 1.1; }
.orig { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--muted); background: var(--ground); border: 1px solid var(--rule); border-radius: var(--radius-control); padding: 8px 10px; margin-top: 10px; word-break: break-word; }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin: 18px 0; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field select, .field input { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--control); border-radius: var(--radius-control); overflow: hidden; height: var(--control-height); }
.seg button { border: 0; background: #fff; padding: 0 12px; border-left: 1px solid var(--control); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--text); color: var(--yellow); font-weight: 500; }
.source { display: flex; gap: 10px; align-items: baseline; padding: 12px 14px; border: 1px solid var(--rule); border-radius: var(--radius-control); background: var(--ground); }
.source b { font-weight: 500; }
.conseq { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); margin: 14px 0 20px; }
.conseq div { font-size: 13px; }
.conseq .k { font-size: 12px; color: var(--muted); display: block; }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar .spacer { flex: 1; }
.pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin: 18px 0; }
.pair .side-box { border: 1px solid var(--border); border-radius: var(--radius-control); padding: 12px 14px; }
.pair .side-box.missing { border-style: dashed; color: var(--muted); }
.arrow { color: var(--muted); }
.ai-box { border: 1px dashed var(--control); border-radius: var(--radius-control); padding: 14px; margin: 16px 0; }

/* Variante B: tabella */
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.chip { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--control); background: #fff; font-size: 13px; }
.chip.on { background: var(--text); color: var(--yellow); border-color: var(--text); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 400; font-size: 12px; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); }
td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
td.r, th.r { text-align: right; }
tr.done td { color: var(--muted); }
tr.selrow td { background: var(--yellow-tint); }
td select { width: 100%; height: 32px; }
.desc1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
.bulk { position: sticky; bottom: 64px; margin-top: var(--gap); display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--text); color: #fff; border-radius: var(--radius-card); }
.bulk .btn-secondary { background: var(--yellow); color: var(--text); }

/* Variante C: guidata */
.steps { display: flex; gap: 0; margin-bottom: var(--gap); }
.step { flex: 1; border: 0; background: none; text-align: left; padding: 10px 12px 12px; border-top: 3px solid var(--control); color: var(--muted); }
.step.on { border-top-color: var(--yellow); color: var(--text); font-weight: 500; }
.step.past { border-top-color: var(--text); color: var(--text); }
.step .n { font-family: "Geist Mono", monospace; font-size: 12px; }
.panel { padding: var(--pad); }
.explain { background: var(--yellow-soft); border-left: 3px solid var(--yellow); padding: 10px 14px; margin: 0 0 18px; color: #2b2b28; }
.group { border-top: 1px solid var(--rule); padding: 14px 0; display: grid; grid-template-columns: 24px 1fr auto auto; gap: 12px; align-items: center; }
.group:first-of-type { border-top: 0; }
.group .members { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.big-recon { display: grid; grid-template-columns: repeat(5, auto); gap: 8px 24px; align-items: baseline; justify-content: start; margin: 8px 0 18px; }
.big-recon .v { font-size: 22px; }
.nav-steps { display: flex; justify-content: space-between; margin-top: 20px; }
.voci td { padding: 6px 12px; }


/* Variante D: tabella con passi, gruppi e pannello di dettaglio */
.dsteps { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
.dstep { text-align: left; background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--border); border-radius: var(--radius-card); padding: 12px 16px; color: var(--text); }
.dstep:hover { background: var(--yellow-soft); }
.dstep.on { border-top-color: var(--yellow); border-color: var(--text); }
.dstep.done { border-top-color: var(--text); }
.dstep .lbl { font-weight: 500; }
.dstep .cnt { font-size: 22px; line-height: 1.2; }
.dstep .sub { font-size: 12px; color: var(--muted); }
.dwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
.dwrap.open { grid-template-columns: minmax(0, 1fr) 460px; }
.dwrap > * { min-width: 0; }
.dpanel { position: sticky; top: 16px; padding: var(--pad); max-height: calc(100vh - 32px); overflow: auto; }
.dpanel .close { float: right; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--yellow-soft); }
tr.current td { background: var(--yellow-tint); }
tr.current td:first-child { border-left: 3px solid var(--text); }
.dgroup { border-top: 1px solid var(--rule); }
.dgroup-h { display: grid; grid-template-columns: 1fr auto auto auto; gap: 16px; align-items: center; padding: 12px 16px; }
.dgroup-h .t { font-weight: 500; }
.help-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.help-toggle input { height: 16px; width: 16px; }
/* Barra prototipo: chiaramente estranea al design */
.proto { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #5b2bd6; color: #fff; border-radius: 22px; padding: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.25); z-index: 50; font: 500 13px system-ui, sans-serif; }
.proto button { background: rgba(255,255,255,.2); color: #fff; border: 0; border-radius: 18px; width: 34px; height: 34px; font-size: 16px; }
.proto span { padding: 0 12px; white-space: nowrap; }
.state { position: fixed; right: 16px; bottom: 16px; background: #222; color: #ddd; font: 12px/1.5 ui-monospace, monospace; padding: 8px 12px; border-radius: 8px; z-index: 49; }

@media (max-width: 900px) {
  .dsteps { grid-template-columns: 1fr 1fr; }
  .dwrap.open { grid-template-columns: 1fr; }
  .dpanel { position: static; max-height: none; }
  .dgroup-h { grid-template-columns: 1fr auto; }
  .shell { grid-template-columns: 1fr; }
  .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; align-items: center; }
  .side .scope, .side .nav .grp, .side .foot { display: none; }
  .nav { display: flex; gap: 4px; }
  .nav a { white-space: nowrap; }
  .nav a .count { display: none; }
  .detail { position: static; }
  .toolbar .btn { white-space: normal; height: auto; padding: 8px 12px; }
  .main { padding: 16px 16px 120px; }
  .title-row { flex-direction: column; }
  .actions { justify-content: flex-start; }
  .recon { grid-template-columns: 1fr 1fr; gap: 12px; }
  .recon .ok-line { grid-column: 1 / -1; justify-self: start; text-align: left; }
  .progress { margin-left: 0; }
  .qa { grid-template-columns: 1fr; }
  .form, .conseq { grid-template-columns: 1fr; }
  .pair { grid-template-columns: 1fr; }
  .arrow { transform: rotate(90deg); justify-self: center; }
  table thead { display: none; }
  table, tbody, tr, td { display: block; width: 100%; }
  tr { border-bottom: 1px solid var(--border); padding: 8px 0; }
  td { border: 0; padding: 4px 12px; }
  td.r { text-align: left; }
  .desc1 { max-width: none; white-space: normal; }
  .big-recon { grid-template-columns: 1fr 1fr; }
  .steps .step .lbl { display: none; }
  .state { display: none; }
  .bulk { bottom: 70px; flex-wrap: wrap; }
}
</style>
</head>

  if (stepC === 2) { const groups = {}; bulkable().concat(M.filter(m => m.stato === 'confermato' && (m.fonte === 'regola' || m.fonte === 'storico'))).forEach(m => { const k = m.sel.tip + '|' + m.sel.ini; (groups[k] = groups[k] || []).push(m); });
    const nb = bulkable().length;
    body = `<h2>Proposte già pronte</h2><p class="explain">Per questi movimenti c’è una regola o un movimento simile già confermato in passato. Controlla i gruppi: se uno è sbagliato, togli la spunta e lo sistemi a parte.</p>` +
      Object.values(groups).map(l => { const m = l[0]; const tot = l.reduce((s, x) => s + Math.round(x.imp * 100), 0) / 100; const allDone = l.every(x => x.stato === 'confermato');
        return `<div class="group"><input type="checkbox" ${allDone ? 'checked disabled' : 'checked'} aria-label="Includi" style="height:16px;width:16px">
          <div><b>${TIPOLOGIE[m.sel.tip].nome}</b> · ${INIZIATIVE[m.sel.ini].nome}<div class="small muted">${voce(m)} · ${fonteTxt(m)}</div></div>
          <span class="num">${l.length} mov.</span><span class="money">${signed(tot)} €</span>
          <div class="members">${l.map(x => x.data + ' ' + x.breve).join(' · ')}</div></div>`; }).join('') +
      `<div class="bar" style="margin-top:12px"><button class="btn btn-primary" data-act="bulk" ${nb ? '' : 'disabled'}>Conferma ${nb} movimenti</button></div>`; }
  if (stepC === 3) { const l = M.filter(m => m.fonte === 'nessuna');
    const m = l[Math.min(idxC, l.length - 1)]; const ap = aiPending();
    body = `<h2>Da decidere uno per uno</h2><p class="explain">Per questi movimenti non c’è una regola né un precedente. Scegli tipologia e iniziativa; se non sai, chiedi un suggerimento all’AI o segna il movimento come dubbio.</p>
      ${ap.length ? `<button class="btn btn-ghost" data-act="ai-all">Chiedi all’AI per tutti e ${ap.length} · circa ${eur(ap.length * 0.01)} €</button>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:16px"><div><span class="small muted">${idxC + 1} di ${l.length} · ${m.data}/2026</span><div class="amount money ${m.imp > 0 ? 'in' : ''}" style="font-size:26px">${signed(m.imp)} €</div><div>${m.breve}</div></div><span class="pill ${m.stato === 'confermato' ? 'ok' : ''}">${m.stato}</span></div>
      <div class="orig">${m.desc}</div>${editor(m)}${itemActions(m)}
      <div class="bar" style="margin-top:10px"><button class="btn btn-ghost" data-act="c-prev" ${idxC === 0 ? 'disabled' : ''}>Precedente</button><button class="btn btn-ghost" data-act="c-next" ${idxC >= l.length - 1 ? 'disabled' : ''}>Successivo</button></div>`; }
  if (stepC === 4) { const c = counts(); const byVoce = {};
    M.filter(m => m.stato === 'confermato' && m.fonte !== 'giroconto').forEach(m => { const v = voce(m); byVoce[v] = (byVoce[v] || 0) + Math.round(m.imp * 100); });
    body = `<h2>Riepilogo dell’import</h2><p class="explain">Ecco come cambia il rendiconto con i movimenti confermati. I movimenti non confermati restano in attesa e puoi tornarci quando vuoi.</p>
      <p><span class="num">${c.conf}</span> confermati · <span class="num">${c.prop}</span> proposti · <span class="num">${c.nulla}</span> senza proposta · <span class="num">${c.dubbi}</span> dubbi</p>
      <table class="voci"><thead><tr><th>Voce Modello D</th><th class="r">Importo €</th></tr></thead><tbody>${Object.entries(byVoce).sort().map(([v, s]) => `<tr><td>${v}</td><td class="r money">${signed(s / 100)}</td></tr>`).join('') || '<tr><td class="muted">Nessun movimento confermato</td><td class="r muted">—</td></tr>'}</tbody></table>`; }
  return header(true) + steps + `<section class="card panel">${body}<div class="nav-steps"><button class="btn btn-ghost" data-act="c-back" ${stepC === 0 ? 'disabled' : ''}>Indietro</button><button class="btn btn-primary" data-act="c-fwd" ${stepC === STEPS.length - 1 ? 'disabled' : ''}>Avanti</button></div></section>`;
}


/* ---------- Variante D: base tabella + passi e spiegazioni (C) + gruppi (C) + dettaglio (A) ---------- */
let stepD = 'decidere'; let openD = null; let helpD = true; const selD = new Set();
const DSTEPS = {
  giroconti: { lbl: 'Giroconti', sub: 'soldi spostati tra i nostri conti', f: m => m.fonte === 'giroconto',
    help: 'Questi movimenti non sono né spese né incassi: spostano denaro da un conto all’altro dell’associazione. Per ognuno l’app ha trovato o propone l’altra metà. Non entrano nel Modello D.' },
  proposte: { lbl: 'Proposte pronte', sub: 'da regola o da movimenti simili', f: m => (m.fonte === 'regola' || m.fonte === 'storico'),
    help: 'Per questi movimenti c’è una regola o un movimento simile già confermato in passato. Sono raggruppati per tipologia e iniziativa: controlla ogni gruppo e confermalo in un colpo. Se un movimento è sbagliato, aprilo e correggilo prima.' },
  decidere: { lbl: 'Da decidere', sub: 'nessuna regola né precedente', f: m => m.fonte === 'nessuna',
    help: 'Per questi movimenti non c’è una regola né un precedente. Apri ogni riga, scegli tipologia e iniziativa; se non sai, chiedi un suggerimento all’AI o segna il movimento come dubbio.' },
  tutti: { lbl: 'Tutti i movimenti', sub: 'l’intero import', f: m => true,
    help: 'Tutti i 16 movimenti dell’import. Clicca una riga per vederne il dettaglio; seleziona più righe per agire su tutte insieme.' },
};
const openCount = k => M.filter(DSTEPS[k].f).filter(m => m.stato !== 'confermato').length;
function rowD(m) {
  const giro = m.fonte === 'giroconto';
  return `<tr class="clickable ${m.stato === 'confermato' ? 'done' : ''} ${openD === m.id ? 'current' : ''} ${selD.has(m.id) ? 'selrow' : ''}" data-act="d-open" data-id="${m.id}">
    <td style="width:36px"><input type="checkbox" style="height:16px;width:16px" data-act="d-check" data-id="${m.id}" ${selD.has(m.id) ? 'checked' : ''} aria-label="Seleziona"></td>
    <td class="num" style="width:60px">${m.data}</td>
    <td><div class="desc1">${m.breve}</div><div class="small muted">${m.causale}${m.dubbio ? ' · <span class="pill warn">dubbio</span>' : ''}</div></td>
    <td class="r money" style="width:110px">${signed(m.imp)}</td>
    <td style="width:190px">${giro ? `<span class="small">Giroconto ${m.imp < 0 ? '→' : '←'} ${m.giro.verso}</span>` : `<select data-f="tip" data-id="${m.id}" aria-label="Tipologia">${tipOptions(m)}</select>`}</td>
    ${openD ? '' : `<td style="width:170px">${giro ? '' : `<select data-f="ini" data-id="${m.id}" aria-label="Iniziativa">${iniOptions(m)}</select>`}</td>
    <td class="small" style="width:96px">${fonteBreve(m)}</td>`}
    <td class="r" style="width:110px">${m.stato === 'confermato' ? '<span class="pill ok">confermato</span>' : `<button class="btn btn-ghost" style="height:30px" data-act="confirm" data-id="${m.id}" ${!m.sel.tip && !giro ? 'disabled' : ''}>Conferma</button>`}</td>
  </tr>`;
}
function headD() {
  return `<thead><tr><th></th><th>Data</th><th>Movimento</th><th class="r">Importo €</th><th>Tipologia</th>${openD ? '' : '<th>Iniziativa</th><th>Fonte</th>'}<th></th></tr></thead>`;
}
function renderD() {
  const steps = `<nav class="dsteps" aria-label="Cosa resta da fare">${['giroconti', 'proposte', 'decidere', 'tutti'].map(k => { const n = k === 'tutti' ? M.length : openCount(k);
    return `<button class="dstep ${stepD === k ? 'on' : ''} ${k !== 'tutti' && n === 0 ? 'done' : ''}" data-act="d-step" data-k="${k}"><div class="lbl">${DSTEPS[k].lbl}</div><div class="cnt num">${k !== 'tutti' && n === 0 ? 'fatto' : n}</div><div class="sub">${k === 'tutti' ? DSTEPS[k].sub : (n === 0 ? 'niente da fare' : 'da confermare · ' + DSTEPS[k].sub)}</div></button>`; }).join('')}</nav>`;
  const rows = M.filter(DSTEPS[stepD].f);
  const ap = aiPending();
  let content;
  if (stepD === 'proposte') {
    const groups = {}; rows.forEach(m => { const k = m.sel.tip + '|' + m.sel.ini; (groups[k] = groups[k] || []).push(m); });
    content = Object.values(groups).map(l => { const m = l[0]; const tot = l.reduce((s, x) => s + Math.round(x.imp * 100), 0) / 100; const aperti = l.filter(x => x.stato !== 'confermato');
      return `<div class="dgroup"><div class="dgroup-h"><div><span class="t">${TIPOLOGIE[m.sel.tip] ? TIPOLOGIE[m.sel.tip].nome : 'Senza tipologia'}</span> · ${INIZIATIVE[m.sel.ini || ''].nome}<div class="small muted">${voce(m)} · ${fonteTxt(m)}</div></div>
        <span class="num">${l.length} mov.</span><span class="money">${signed(tot)} €</span>
        ${aperti.length ? `<button class="btn btn-primary" data-act="d-group" data-ids="${aperti.map(x => x.id).join(',')}">Conferma il gruppo</button>` : '<span class="pill ok">confermato</span>'}</div>
        <table><tbody>${l.map(rowD).join('')}</tbody></table></div>`; }).join('');
  } else {
    content = `<table>${headD()}<tbody>${rows.map(rowD).join('') || `<tr><td colspan="8" class="muted">Niente da mostrare.</td></tr>`}</tbody></table>`;
  }
  const m = openD && M.find(x => x.id === openD);
  const panel = m ? `<section class="card dpanel" aria-label="Dettaglio movimento">
    <button class="btn btn-ghost close" data-act="d-close" aria-label="Chiudi">Chiudi</button>
    <div class="small muted">${m.data}/2026 · ${m.causale}</div><div class="money" style="font-size:28px;line-height:1.15">${signed(m.imp)} €</div><div>${m.breve}</div>
    <div class="orig">${m.desc}</div>${editor(m, true)}${itemActions(m)}
    <p class="small muted" style="margin:14px 0 0">J/K per spostarti tra le righe, Invio per confermare, Esc per chiudere.</p></section>` : '';
  return header() + recon() + steps +
    (helpD ? `<p class="explain">${DSTEPS[stepD].help}</p>` : '') +
    `<div class="dwrap ${m ? 'open' : ''}"><section class="card" aria-label="Movimenti">
      <div class="toolbar"><h2>${DSTEPS[stepD].lbl}</h2><span style="flex:1"></span>
        <label class="help-toggle"><input type="checkbox" data-act="d-help" ${helpD ? 'checked' : ''}> Mostra le spiegazioni</label>
        ${stepD === 'decidere' && ap.length ? `<button class="btn btn-ghost" data-act="ai-all">Chiedi all’AI per i ${ap.length} · circa ${eur(ap.length * 0.01)} €</button>` : ''}</div>
      ${content}</section>${panel}</div>
    ${selD.size ? `<div class="bulk"><span><span class="num">${selD.size}</span> selezionati</span><span style="flex:1"></span>
      <select data-act="bulk-ini-d" aria-label="Imposta iniziativa" style="height:32px"><option value="">Imposta iniziativa…</option>${Object.entries(INIZIATIVE).map(([k, i]) => `<option value="${k}">${i.nome}</option>`).join('')}</select>
      <button class="btn btn-secondary" data-act="d-bulk-dubbio">Segna come dubbi</button>
      <button class="btn btn-secondary" data-act="d-bulk-conf">Conferma i selezionati</button></div>` : ''}`;
}
/* ---------- Switcher e rendering ---------- */
const VARIANTS = { A: ['Coda e dettaglio', renderA], B: ['Tabella', renderB], C: ['Percorso guidato', renderC], D: ['Combinata', renderD] };
const keys = Object.keys(VARIANTS);
let variant = new URLSearchParams(location.search).get('variant') || 'D'; if (!VARIANTS[variant]) variant = 'A';
function setVariant(v) { variant = v; const u = new URL(location); u.searchParams.set('variant', v); history.replaceState(null, '', u); render(); }
function render() {
  document.getElementById('app').innerHTML = VARIANTS[variant][1]();
  document.getElementById('vlabel').textContent = variant + ' (' + VARIANTS[variant][0] + ')';
  const c = counts(); document.getElementById('navCount').textContent = (c.prop + c.nulla) ? 'Da confermare ' + (c.prop + c.nulla) : '';
  document.getElementById('state').textContent = `confermati ${c.conf} · proposti ${c.prop} · senza proposta ${c.nulla} · dubbi ${c.dubbi}`;
}
document.getElementById('prev').onclick = () => setVariant(keys[(keys.indexOf(variant) + keys.length - 1) % keys.length]);
document.getElementById('next').onclick = () => setVariant(keys[(keys.indexOf(variant) + 1) % keys.length]);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') document.getElementById('prev').click();
  if (e.key === 'ArrowRight') document.getElementById('next').click();
  if (variant === 'D' && openD) {
    const order = M.filter(DSTEPS[stepD].f); const i = order.findIndex(x => x.id === openD);
    if (e.key === 'j' && i < order.length - 1) { openD = order[i + 1].id; render(); }
    if (e.key === 'k' && i > 0) { openD = order[i - 1].id; render(); }
    if (e.key === 'Escape') { openD = null; render(); }
    if (e.key === 'Enter') { const m = M.find(x => x.id === openD); if (m.sel.tip || m.fonte === 'giroconto') { confirm(m); const nx = order.find(x => x.stato !== 'confermato' && x.id !== m.id); openD = nx ? nx.id : m.id; render(); } }
  }
  if (variant === 'A') {
    const order = groupsA().flatMap(([, l]) => l); const i = order.findIndex(x => x.id === selA);
    if (e.key === 'j') { selA = order[Math.min(i + 1, order.length - 1)].id; render(); }
    if (e.key === 'k') { selA = order[Math.max(i - 1, 0)].id; render(); }
    if (e.key === 'Enter') { const m = M.find(x => x.id === selA); if (m.sel.tip || m.fonte === 'giroconto') { confirm(m); selA = nextOpen(m.id); render(); } }
  }
});
const byId = id => M.find(m => m.id === +id);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-f="soc"]'); if (!b) return;
  if (b.dataset.f === 'soc') { byId(b.dataset.id).sel.soc = b.dataset.v; return render(); }
  const a = b.dataset.act, m = byId(b.dataset.id);
  if (a === 'sel') selA = m.id;
  if (a === 'confirm') { confirm(m); if (variant === 'A') selA = nextOpen(m.id); if (variant === 'D' && openD === m.id) { const nx = M.filter(DSTEPS[stepD].f).find(x => x.stato !== 'confermato'); openD = nx ? nx.id : m.id; } }
  if (a === 'dubbio') m.dubbio = !m.dubbio;
  if (a === 'bulk') bulkable().forEach(confirm);
  if (a === 'ai-one') askAI([m]);
  if (a === 'ai-all') askAI(aiPending());
  if (a === 'annulla') alert('Prototipo: l’import si annulla per intero solo se nessun movimento è confermato.');
  if (a === 'filter') filterB = b.dataset.k;
  if (a === 'check') { selB.has(m.id) ? selB.delete(m.id) : selB.add(m.id); }
  if (a === 'bulk-sel') { selB.forEach(id => { const x = byId(id); if (x.sel.tip || x.fonte === 'giroconto') confirm(x); }); selB.clear(); }
  if (a === 'bulk-dubbio') { selB.forEach(id => byId(id).dubbio = true); selB.clear(); }
  if (a === 'step') stepC = +b.dataset.i;
  if (a === 'c-fwd') stepC = Math.min(stepC + 1, STEPS.length - 1);
  if (a === 'c-back') stepC = Math.max(stepC - 1, 0);
  if (a === 'c-next') idxC++;
  if (a === 'c-prev') idxC--;
  if (a === 'd-step') { stepD = b.dataset.k; selD.clear(); openD = null; }
  if (a === 'd-open') { if (e.target.closest('select, input, button')) return; openD = m.id; }
  if (a === 'd-close') openD = null;
  if (a === 'd-check') { selD.has(m.id) ? selD.delete(m.id) : selD.add(m.id); }
  if (a === 'd-help') helpD = b.checked;
  if (a === 'd-group') b.dataset.ids.split(',').forEach(id => confirm(byId(id)));
  if (a === 'd-bulk-conf') { selD.forEach(id => { const x = byId(id); if (x.sel.tip || x.fonte === 'giroconto') confirm(x); }); selD.clear(); }
  if (a === 'd-bulk-dubbio') { selD.forEach(id => byId(id).dubbio = true); selD.clear(); }
  render();
});
document.addEventListener('change', e => {
  const f = e.target.dataset.f;
  if (e.target.dataset.act === 'bulk-ini') { selB.forEach(id => { const x = byId(id); if (x.fonte !== 'giroconto') x.sel.ini = e.target.value; }); return render(); }
  if (e.target.dataset.act === 'bulk-ini-d') { selD.forEach(id => { const x = byId(id); if (x.fonte !== 'giroconto') x.sel.ini = e.target.value; }); return render(); }
  if (!f) return; const m = byId(e.target.dataset.id);
  if (f === 'giust') { m.giust = e.target.value; return; }
  m.sel[f] = e.target.value;
  if (m.stato === 'da classificare' && m.sel.tip) m.stato = 'proposto';
  render();
});
render();
</script>
</body>
